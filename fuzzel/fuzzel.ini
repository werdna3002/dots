
[main]
font=monospace:size=12
prompt="❯  "
placeholder="Search applications..."
icon-theme=Papirus-Dark
icons-enabled=yes
width=42
lines=10
horizontal-pad=16
vertical-pad=10
inner-pad=8
terminal=ghostty -e

[colors]
background=1e1e2eee
text=cdd6f4ff
prompt=cba6f7ff
placeholder=6c7086ff
input=cdd6f4ff
match=f5c2e7ff
selection=45475aff
selection-text=cdd6f4ff
selection-match=f5c2e7ff
counter=7f849cff
border=cba6f7ff

[border]
width=2
radius=12
selection-radius=6

[key-bindings]
prev = Up Control+p Mod1+k
next = Down Control+n Mod1+j
